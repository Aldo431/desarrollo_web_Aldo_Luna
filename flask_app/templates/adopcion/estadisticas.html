<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadisticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Estadisticas</h1>
<div id="graficos" style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
    <h2>Gráfico de avisos por día</h2>
    <img src="{{ url_for('static', filename='svg/linea.png') }}" alt="Gráfico de líneas" width="500">

    <h2>Gráfico de avisos por tipo de mascota</h2>
    <img src="{{ url_for('static', filename='svg/torta.png') }}" alt="Gráfico de torta" width="500">

    <h2>Gráfico de avisos por mes</h2>
    <img src="{{ url_for('static', filename='svg/barras.png') }}" alt="Gráfico de barras" width="500">
</div>

    <div>
        <button type="button" id="btn-volver">Volver al portal</button>
    </div>

<script>
const volverMenu = () => {
     window.location.href = "{{ url_for('index') }}";
}   
let btnVolver = document.getElementById("btn-volver");
btnVolver.addEventListener("click", volverMenu);
</script>
</body>
</html>
