<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmación de Aviso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>“¿Está seguro que desea agregar este aviso de adopción?</h1>
    <div>
        <button type="button" id="confirmar">
        Sí, estoy seguro
        </button>
        <button type="button" id="rechazar">
        No, no estoy seguro, quiero volver al formulario
        </button>
    </div>
<script>

const confirmar = () => {
    if (window.opener && !window.opener.closed) {
        window.opener.document.getElementById("aviso-formulario").submit();
    }    
    window.close();
}
const rechazar = () => {
    window.close();
}   
let btnConfirmar = document.getElementById("confirmar");
btnConfirmar.addEventListener("click", confirmar);

let btnRechazar = document.getElementById("rechazar");
btnRechazar.addEventListener("click", rechazar);
</script>
</body>
</html>
