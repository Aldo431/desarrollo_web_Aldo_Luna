<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadisticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Estadisticas</h1>
<div id="graficos" style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
    <h2>Gráfico de avisos por día</h2>
    <div id="grafico-lineas" style="width: 600px; height: 400px;"></div>

    <h2>Gráfico de avisos por tipo de mascota</h2>
    <div id="grafico-torta" style="width: 500px; height: 400px;"></div>

    <h2>Gráfico de avisos por mes</h2>
    <div id="grafico-barras" style="width: 600px; height: 400px;"></div>
</div>

    <div>
        <button type="button" id="btn-volver">Volver al portal</button>
    </div>

<script>
const volverMenu = () => {
     window.location.href = "{{ url_for('index') }}";
}   
let btnVolver = document.getElementById("btn-volver");
btnVolver.addEventListener("click", volverMenu);
</script>
<script src="https://code.highcharts.com/highcharts.js"></script>
<script>
   
let fetchAJAX = (url) => {
  fetch(url) 
    .then((response) => {
      if (!response.ok) {
        throw new Error("Network response was not ok");
      }
      return response.json(); 
    })
    .then((ajaxResponse) => {
      populateTorta(ajaxResponse["data"]);
      console.log("Fetch response:", ajaxResponse);
    })
    
    .catch((error) => {
      console.error("There has been a problem with your fetch operation:", error);
    });
};
let fetchAJAX2 = (url) => {
  fetch(url)
    .then((response) => {
      if (!response.ok) throw new Error("Network response was not ok");
      return response.json();
    })
    .then((ajaxResponse) => {
      populateBarChart(ajaxResponse["data"]);
      console.log("Fetch response (barras):", ajaxResponse);
    })
    .catch((error) => {
      console.error("There has been a problem with your fetch operation:", error);
    });
};
let fetchAJAX3 = (url) => {
  fetch(url)
    .then((response) => {
      if (!response.ok) throw new Error("Network response was not ok");
      return response.json();
    })
    .then((ajaxResponse) => {
      populateLineChart(ajaxResponse["data"]);
      console.log("Fetch response (líneas):", ajaxResponse);
    })
    .catch((error) => {
      console.error("There has been a problem with your fetch operation:", error);
    });
};
function populateTorta(data) {
  const colores = {
    "perro": "#2a6f9e",
    "gato": "#7bb7e0"
  };

  Highcharts.chart("grafico-torta", {
    chart: { type: "pie" },
    title: { text: "Avisos por tipo de mascota" },
    tooltip: { pointFormat: "{series.name}: <b>{point.y}</b>" },
    accessibility: { point: { valueSuffix: "%" } },
    plotOptions: {
      pie: {
        allowPointSelect: true,
        cursor: "pointer",
        dataLabels: { enabled: true, format: "<b>{point.name}</b>: {point.y}" }
      }
    },
    series: [{
      name: "Avisos",
      colorByPoint: true,
      data: data.map(item => ({
        name: item.tipo,
        y: item.cantidad,
        color: colores[item.tipo.toLowerCase()] 
      }))
    }]
  });
}

function populateBarChart(data) {
  const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun",
                 "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

  const perros = data.map(item => item.perro);
  const gatos = data.map(item => item.gato);

  Highcharts.chart("grafico-barras", {
    chart: { type: "column" },
    title: { text: "Avisos por mes y tipo de mascota" },
    xAxis: {
      categories: meses,
      crosshair: true
    },
    yAxis: {
      min: 0,
      title: { text: "Cantidad de avisos" }
    },
    tooltip: {
      shared: true,
      useHTML: true
    },
    plotOptions: {
      column: { pointPadding: 0.2, borderWidth: 0 }
    },
    series: [
      { name: "Perros", data: perros, color: "#2a6f9e" },
      { name: "Gatos", data: gatos, color: "#7bb7e0" }
    ]
  });
}
function populateLineChart(data) {
  const fechas = data.map(item => item.fecha);
  const cantidades = data.map(item => item.cantidad);

  Highcharts.chart("grafico-lineas", {
    chart: { type: "line" },
    title: { text: "Avisos agregados por día" },
    xAxis: { categories: fechas, title: { text: "Fecha" } },
    yAxis: { title: { text: "Cantidad de avisos" }, min: 0 },
    tooltip: { shared: true, valueSuffix: " avisos" },
    series: [{
      name: "Avisos por día",
      data: cantidades,
      color: "#2a6f9e"
    }]
  });
}

document.addEventListener("DOMContentLoaded", () => {
  fetchAJAX("/get-avisos-tipo");
  fetchAJAX2("/get-avisos-mes");
  fetchAJAX3("/get-avisos-dia");
});

</script>
</body>
</html>
